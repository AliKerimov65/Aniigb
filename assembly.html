<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Мультипликация сборки · спортзал 24×46 м (МАРХИ) · Дудинка</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; font-family:'Segoe UI', system-ui, sans-serif; background:#dfe9f0; }
  #scene { position:absolute; inset:0; }
  #labels { position:absolute; inset:0; pointer-events:none; z-index:1; }
  #panel { position:absolute; z-index:20; top:14px; left:14px; width:330px; max-height:calc(100% - 90px); overflow-y:auto;
    background:rgba(255,255,255,0.93); border:1px solid #b9c7d2; border-radius:10px;
    padding:14px 16px; box-shadow:0 4px 18px rgba(30,50,70,0.18); font-size:13px; color:#1e2c38; }
  #panel h1 { font-size:15px; margin:0 0 2px 0; color:#0e3a5c; }
  #panel .sub { font-size:11.5px; color:#5a6b78; margin-bottom:10px; }
  #stages { list-style:none; margin:0; padding:0; font-size:12.5px; }
  #stages li { padding:3px 8px; border-radius:5px; margin:1px 0; color:#5a6b78; }
  #stages li.done { color:#1e2c38; }
  #stages li.active { background:#0e6aa8; color:#fff; font-weight:600; }
  #controls { position:absolute; z-index:20; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:10px; align-items:center;
    background:rgba(255,255,255,.92); border:1px solid #b9c7d2; border-radius:10px; padding:8px 14px; box-shadow:0 4px 18px rgba(30,50,70,.15); }
  #playBtn { width:42px; height:42px; border-radius:50%; border:none; background:#0e6aa8; color:#fff; font-size:16px; cursor:pointer; }
  #playBtn:hover { background:#0b5585; }
  #timeline { width:min(520px, 45vw); accent-color:#0e6aa8; }
  #stageName { font-size:12.5px; color:#16405e; min-width:230px; font-weight:600; }
  #hint { position:absolute; z-index:20; bottom:70px; left:50%; transform:translateX(-50%); font-size:11.5px; color:#48606f;
          background:rgba(255,255,255,.8); padding:3px 12px; border-radius:12px; border:1px solid #c8d4dd; }
  .lbl { font:11px 'Segoe UI', system-ui, sans-serif; color:#10344e; background:rgba(255,255,255,.88);
         padding:1px 6px; border-radius:4px; border:1px solid #b3c3cf; white-space:nowrap; }
  .lbl.tag { font-weight:600; color:#0e5c2e; border-color:#7fbc94; background:rgba(240,252,244,.92); }
  .lbl.stage { font-weight:600; color:#7a2d0e; border-color:#d9a684; background:rgba(255,246,240,.94); }
  #labels.noLbl .lbl { display:none; }

/* ---- мобильная адаптация ---- */
@media (max-width: 640px) {
  #panel { top:calc(10px + env(safe-area-inset-top)); left:10px; right:10px; width:auto;
    max-height:36vh; max-height:36dvh; padding:10px 12px; font-size:12px; }
  #panel.collapsed { max-height:46px; overflow:hidden; }
  #controls { bottom:calc(10px + env(safe-area-inset-bottom)); left:10px; right:10px; width:auto; }
  #hint { display:none; }
}
#pToggle { display:none; position:absolute; top:calc(10px + env(safe-area-inset-top)); right:10px; z-index:10;
  width:40px; height:40px; border-radius:10px; border:1px solid #b9c7d2; background:rgba(255,255,255,.92);
  font-size:20px; color:#16405e; cursor:pointer; }
@media (max-width: 640px) { #pToggle { display:block; } }

</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<button id="pToggle" title="Скрыть/показать панель">☰</button>
<div id="panel">
  <h1>Сборка спортзала 24 × 46 м</h1>
  <div class="sub">Технологическая мультипликация: от подготовки площадки до подъёма флагов</div>
  <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;margin:0 0 8px 2px"><input type="checkbox" id="Lb-all" checked> Метки этапов на сцене</label>
  <ul id="stages"></ul>
</div>
<div id="controls">
  <button id="playBtn" title="Пуск / пауза">▶</button>
  <input type="range" id="timeline" min="0" max="1100" step="1" value="55">
  <div id="stageName">Готово к сборке</div>
</div>
<div id="hint">Вращение — левая кнопка · масштаб — колесо · сдвиг — правая кнопка · <a href="index.html" style="color:#0e6aa8">к модели зала</a></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ================= ПАРАМЕТРЫ (совпадают с основной моделью) ================= */
const W=24, L=46, AUX=5, MOD=3.0, SLAB_T=0.12, SLAB_W=1.2;
const FND_D=MOD/Math.SQRT2, FND_BOT=SLAB_T, FND_TOP=FND_BOT+FND_D;
const FLR_T=0.16, FFL=FND_TOP+FLR_T, COL_H=10.0, ROOF_BOT=FFL+COL_H, ROOF_D=FND_D, ARCH_F=0.9;
const TRI=0.7, TRI_R=TRI/Math.sqrt(3), TRI_HR=1.2/Math.sqrt(3);
const OX=1.5, OZ=1.0;
const archY=x=>{const n=(x-W/2)/(W/2); return ARCH_F*(1-n*n);};
const yB=x=>ROOF_BOT+archY(x), yT=x=>yB(x)+ROOF_D;

/* ================= СЦЕНА ================= */
const container=document.getElementById('scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdfe9f0);
scene.fog=new THREE.Fog(0xdfe9f0,150,450);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,1000);
camera.position.set(-42,32,-34);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);
const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
document.getElementById('labels').appendChild(labelRenderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(W/2,6,L/2);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.495;
scene.add(new THREE.HemisphereLight(0xffffff,0x9db4c4,0.95));
const sun=new THREE.DirectionalLight(0xfff4e0,1.35);
sun.position.set(45,75,-35); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-50,right:50,top:60,bottom:-60,far:240});
sun.shadow.bias=-0.0006;
scene.add(sun);

/* ================= ХЕЛПЕРЫ ================= */
const _up=new THREE.Vector3(0,1,0),_dir=new THREE.Vector3(),_mid=new THREE.Vector3(),
      _q=new THREE.Quaternion(),_m=new THREE.Matrix4(),_s=new THREE.Vector3();
function makeRods(list,radius,color,group,opts={}){
  const geo=new THREE.CylinderGeometry(1,1,1,opts.seg||7);
  const mat=new THREE.MeshStandardMaterial({color,metalness:opts.metal??0.55,roughness:opts.rough??0.45});
  const im=new THREE.InstancedMesh(geo,mat,list.length);
  list.forEach(([a,b],i)=>{_dir.subVectors(b,a);const len=_dir.length();
    _mid.addVectors(a,b).multiplyScalar(0.5);_q.setFromUnitVectors(_up,_dir.normalize());
    _s.set(radius,len,radius);_m.compose(_mid,_q,_s);im.setMatrixAt(i,_m);});
  im.castShadow=true; group.add(im);
}
function makeNodes(list,radius,color,group){
  const geo=new THREE.SphereGeometry(1,12,9);
  const mat=new THREE.MeshStandardMaterial({color,metalness:0.35,roughness:0.5});
  const im=new THREE.InstancedMesh(geo,mat,list.length);
  list.forEach((p,i)=>{_m.compose(p,new THREE.Quaternion(),new THREE.Vector3(radius,radius,radius));im.setMatrixAt(i,_m);});
  im.castShadow=true; group.add(im);
}
function box(w,h,d,x,y,z,color,group,opts={}){
  const mat=new THREE.MeshStandardMaterial({color,metalness:opts.metal??0.05,roughness:opts.rough??0.85,
    transparent:opts.opacity!==undefined&&opts.opacity<1,opacity:opts.opacity??1,
    side:opts.double?THREE.DoubleSide:THREE.FrontSide});
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=opts.shadow!==false; m.receiveShadow=true; group.add(m); return m;
}
function label(text,pos,cls,group){
  const div=document.createElement('div'); div.className='lbl'+(cls?' '+cls:''); div.textContent=text;
  const o=new CSS2DObject(div); o.position.copy(pos); (group||scene).add(o);
}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const colZ=[0,6,12,18,24,30,36,42,46];
const P_IN=TRI_R/2+0.155;

/* ================= ЭТАПЫ: ГРУППЫ ================= */
const gS1=new THREE.Group(), gS2=new THREE.Group(), gS3=new THREE.Group(), gS4=new THREE.Group(),
      gS5=new THREE.Group(), gS5b=new THREE.Group(), gS6=new THREE.Group(), gS7=new THREE.Group(), gS8=new THREE.Group(),
      gS9=new THREE.Group(), gS10=new THREE.Group(), gS11=new THREE.Group();
[gS1,gS2,gS3,gS4,gS5,gS5b,gS6,gS7,gS8,gS9,gS10,gS11].forEach(g=>{g.visible=false; scene.add(g);});

/* Этап 1 — подготовка площадки */
box(170,0.2,210,W/2,-0.78,L/2,0xe9eef3,gS1,{shadow:false});
box(W+7,0.55,L+6,W/2,-0.275,L/2,0xc9b99a,gS1);
box(4.4,0.55,4.6,3.2,-0.275,-4.7,0xc9b99a,gS1);
label('Этап 1 · Инженерная подготовка площадки', V(W/2,2.4,-6),'stage',gS1);

/* Этап 2 — ж/б плиты-ленты 120 мм */
for(let i=0;i<=8;i++) box(SLAB_W-0.015,SLAB_T,L+2*OZ,i*MOD,SLAB_T/2,L/2,0xb9bec4,gS2,{rough:0.95});
label('Этап 2 · Сборные ж/б плиты 120 мм, ш. 1,2 м по осям', V(W/2,2.4,-6),'stage',gS2);

/* Этапы 3–4 — пространственный фундамент (зеркало покрытия) */
{
  const fx=[]; for(let i=0;i<=9;i++) fx.push(-OX+i*MOD);
  const fz=[]; for(let j=0;j<=16;j++) fz.push(-OZ+j*MOD);
  const fbx=[]; for(let i=0;i<9;i++) fbx.push(fx[i]+MOD/2);
  const fbz=[]; for(let j=0;j<16;j++) fbz.push(fz[j]+MOD/2);
  const FB=(i,j)=>V(fbx[i],FND_BOT,fbz[j]), FT=(i,j)=>V(fx[i],FND_TOP,fz[j]);
  const chB=[],nB=[],chT=[],diags=[],nT=[];
  for(let j=0;j<fbz.length;j++) for(let i=0;i<fbx.length;i++){
    nB.push(FB(i,j));
    if(i<fbx.length-1) chB.push([FB(i,j),FB(i+1,j)]);
    if(j<fbz.length-1) chB.push([FB(i,j),FB(i,j+1)]);
  }
  for(let j=0;j<fz.length;j++) for(let i=0;i<fx.length;i++){
    nT.push(FT(i,j));
    if(i<fx.length-1) chT.push([FT(i,j),FT(i+1,j)]);
    if(j<fz.length-1) chT.push([FT(i,j),FT(i,j+1)]);
  }
  for(let j=0;j<fbz.length;j++) for(let i=0;i<fbx.length;i++)
    diags.push([FB(i,j),FT(i,j)],[FB(i,j),FT(i+1,j)],[FB(i,j),FT(i,j+1)],[FB(i,j),FT(i+1,j+1)]);
  makeRods(chB,0.062,0x8a6a45,gS3); makeNodes(nB,0.105,0xd97a1e,gS3);
  label('Этап 3 · Нижний пояс пространственного фундамента', V(W/2,3.0,-6),'stage',gS3);
  makeRods(chT,0.062,0x9a7b52,gS4); makeRods(diags,0.048,0xc0a67e,gS4); makeNodes(nT,0.115,0xd97a1e,gS4);
  label('Этап 4 · Раскосы и верхний пояс фундамента — готово проветриваемое подполье 2,12 м', V(W/2,3.4,-6),'stage',gS4);
}

/* Этап 5 — пол: сэндвич-панели по верхнему поясу */
box(W,FLR_T,L,W/2,FND_TOP+FLR_T/2,L/2,0xded8c8,gS5,{rough:0.7});
label('Этап 5 · Пол из сэндвич-панелей по верхнему поясу фундамента, отм. +2,400', V(W/2,4.0,-6),'stage',gS5);

/* Этап 5б — ветро-снегозащитные щиты подполья */
{
  const GAP=0.35, shH=FND_D-GAP-0.15, shY=FND_BOT+GAP+shH/2;
  const shOpts={opacity:0.5,metal:0.25,rough:0.45,double:true,shadow:false};
  [-OX,W+OX].forEach(x=>box(0.06,shH,L+2*OZ-0.1,x,shY,L/2,0xb8c8d4,gS5b,shOpts));
  [-OZ,L+OZ].forEach(z=>box(W+2*OX-0.1,shH,0.06,W/2,shY,z,0xb8c8d4,gS5b,shOpts));
  label('Этап 5б · Ветро-снегозащитные щиты подполья · зазор 350 мм · летом закрываются', V(W/2,3.6,-6),'stage',gS5b);
}

/* Этап 6 — колонны △700 и усиленные △1200 */
{
  const rodsS=[],nodesS=[],supS=[],rodsH=[],nodesH=[],supH=[];
  const colDefs=[];
  colZ.forEach(z=>{colDefs.push([0,z,Math.PI]); colDefs.push([W,z,0]);});
  [0,6,12,18,24].forEach(x=>{colDefs.push([x,0,-Math.PI/2]); colDefs.push([x,L,Math.PI/2]);});
  const isHeavy=(cx,cz)=>{
    const corner=(cx===0||cx===W)&&(cz===0||cz===L);
    const si=colZ.indexOf(cz);
    const sideAlt=(cx===0||cx===W)&&si>=0&&si%2===0;
    const endAlt=(cz===0||cz===L)&&(cx===0||cx===12||cx===W);
    return corner||sideAlt||endAlt;
  };
  colDefs.forEach(([cx,cz,phi])=>{
    const heavy=isHeavy(cx,cz), R=heavy?TRI_HR:TRI_R;
    const rods=heavy?rodsH:rodsS, nodes=heavy?nodesH:nodesS, sup=heavy?supH:supS;
    const topY=yB(cx);
    const LEVELS=[]; for(let k=0;k<=5;k++) LEVELS.push(FFL+(topY-FFL)*k/5);
    const verts=[0,1,2].map(k=>{const a=phi+k*2*Math.PI/3; return [cx+R*Math.cos(a),cz+R*Math.sin(a)];});
    verts.forEach(([vx,vz])=>rods.push([V(vx,FFL,vz),V(vx,topY,vz)]));
    LEVELS.forEach(y=>verts.forEach(([vx,vz])=>nodes.push(V(vx,y,vz))));
    for(let l=0;l<LEVELS.length-1;l++) for(let f=0;f<3;f++){
      const [ax,az]=verts[f],[bx2,bz2]=verts[(f+1)%3];
      if(l%2===0) rods.push([V(ax,LEVELS[l],az),V(bx2,LEVELS[l+1],bz2)]);
      else        rods.push([V(bx2,LEVELS[l],bz2),V(ax,LEVELS[l+1],az)]);
    }
    verts.forEach(([vx,vz])=>rods.push([V(vx,topY,vz),V(cx,topY,cz)]));
    sup.push(V(cx,topY,cz));
  });
  makeRods(rodsS,0.075,0x3a5f8a,gS6,{seg:8}); makeNodes(nodesS,0.075,0xd97a1e,gS6); makeNodes(supS,0.20,0xb33a2b,gS6);
  makeRods(rodsH,0.085,0x2b3f5c,gS6,{seg:8}); makeNodes(nodesH,0.10,0xd97a1e,gS6);  makeNodes(supH,0.26,0xb33a2b,gS6);
  label('Этап 6 · Колонны △700, по углам и через одну — △1200', V(W/2,5.2,-6),'stage',gS6);
}

/* Этап 7 — покрытие ПСПК со вспарушиванием: сборка на земле → подъём */
{
  const bx=[]; for(let x=0;x<=W;x+=MOD) bx.push(x);
  const bz=[]; for(let z=0;z<=45;z+=MOD) bz.push(z); bz.push(L);
  const tx=bx.slice(0,-1).map(x=>x+MOD/2);
  const tz=[]; for(let j=0;j<bz.length-1;j++) tz.push((bz[j]+bz[j+1])/2);
  const B=(i,j)=>V(bx[i],yB(bx[i]),bz[j]), T=(i,j)=>V(tx[i],yT(tx[i]),tz[j]);
  const chB=[],chT=[],diags=[],nB=[],nT=[];
  for(let j=0;j<bz.length;j++) for(let i=0;i<bx.length;i++){
    nB.push(B(i,j));
    if(i<bx.length-1) chB.push([B(i,j),B(i+1,j)]);
    if(j<bz.length-1) chB.push([B(i,j),B(i,j+1)]);
  }
  for(let j=0;j<tz.length;j++) for(let i=0;i<tx.length;i++){
    nT.push(T(i,j));
    if(i<tx.length-1) chT.push([T(i,j),T(i+1,j)]);
    if(j<tz.length-1) chT.push([T(i,j),T(i,j+1)]);
    diags.push([T(i,j),B(i,j)],[T(i,j),B(i+1,j)],[T(i,j),B(i,j+1)],[T(i,j),B(i+1,j+1)]);
  }
  makeRods(chB,0.062,0x2e6f9e,gS7); makeRods(chT,0.062,0x35807a,gS7); makeRods(diags,0.048,0x6fa8c9,gS7);
  makeNodes(nB,0.125,0xd97a1e,gS7); makeNodes(nT,0.105,0xe8a54b,gS7);
  label('Этап 7 · Покрытие со вспарушиванием: сборка на земле → подъём на +12,400', V(W/2,yT(12)+1.2,25.5),'stage',gS7);
}

/* Этап 8 — ограждение: сэндвич-панели изнутри каркаса */
{
  const panOpts={opacity:0.32,metal:0.1,rough:0.55,double:true,shadow:false};
  const H=ROOF_BOT-FFL-0.02, yc=FFL+H/2;
  for(let k=0;k<colZ.length-1;k++){
    const z0=colZ[k],z1=colZ[k+1],len=z1-z0-0.15,zc=(z0+z1)/2;
    box(0.15,H,len,P_IN,yc,zc,0xd6e7f2,gS8,panOpts);
    box(0.15,H,len,W-P_IN,yc,zc,0xd6e7f2,gS8,panOpts);
  }
  [0,6,12,18].forEach(x0=>{
    const xc=x0+3, top=yB(xc)-0.02;
    box(6-0.15,top-FFL,0.15,xc,(FFL+top)/2,L-P_IN,0xd6e7f2,gS8,panOpts);
    box(6-0.15,top-FFL,0.15,xc,(FFL+top)/2,P_IN,0xd6e7f2,gS8,panOpts);
  });
  box(W-2*P_IN,12.0-FFL,0.15,W/2,(FFL+12.0)/2,AUX+0.28,0xe2d9c8,gS8,{...panOpts,opacity:0.4});
  box(1.6,2.2,0.06,3.2,FFL+1.1,0.36,0x2b4a63,gS8,{shadow:false});
  for(let i=0;i<8;i++){
    const xc=i*3+1.5;
    box(3,0.12,L,xc,yT(xc)+0.06,L/2,0x9fc3dd,gS8,{...panOpts,opacity:0.22});
  }
  label('Этап 8 · Сэндвич-панели изнутри каркаса — контур без мостиков холода', V(W/2,yT(12)+1.2,25.5),'stage',gS8);
}

/* Этап 9 — вспомогательный блок + поле */
{
  const axX=[0.6,6,12,18,23.4], axZ=[0.5,2.5,4.5], floors=[FFL+3.2,FFL+6.4,FFL+9.6];
  const rods=[];
  axX.forEach(x=>axZ.forEach(z=>rods.push([V(x,FFL,z),V(x,FFL+9.6,z)])));
  makeRods(rods,0.14,0x7a8c5a,gS9,{seg:4});
  floors.forEach(f=>{
    axZ.forEach(z=>box(W-1.2,0.24,0.2,W/2,f-0.12,z,0x7a8c5a,gS9,{metal:0.4,rough:0.5}));
    axX.forEach(x=>box(0.2,0.24,4.0,x,f-0.12,2.5,0x7a8c5a,gS9,{metal:0.4,rough:0.5}));
    box(W-1.2,0.14,4.2,W/2,f+0.07,2.5,0xcdd3d8,gS9,{rough:0.9});
  });
  // лестница + крыльцо + пандус
  box(2.4,0.15,2.0,3.8,FFL-0.075,-3.6,0xc3c9cf,gS9);
  const ramp=box(1.5,0.08,5.2,6.6,FFL/2-0.02,-4.6,0xc3c9cf,gS9);
  ramp.rotation.x=-Math.atan2(FFL,5.2); ramp.position.y=FFL/2;
  // поле
  const cx=W/2, cz=(AUX+P_IN+L-P_IN)/2, pw=19, pl=38, ly=FFL+0.012;
  box(W-2*P_IN-0.2,0.02,40.08,cx,FFL+0.005,cz,0x3f9e4d,gS9,{shadow:false,rough:0.9});
  const line=(w,d,x,z)=>box(w,0.006,d,x,ly+0.008,z,0xf4f8f4,gS9,{shadow:false,rough:0.6});
  line(pw,0.08,cx,cz-pl/2); line(pw,0.08,cx,cz+pl/2);
  line(0.08,pl,cx-pw/2,cz); line(0.08,pl,cx+pw/2,cz);
  line(pw,0.08,cx,cz);
  const circ=new THREE.Mesh(new THREE.TorusGeometry(3,0.045,8,48),new THREE.MeshStandardMaterial({color:0xf4f8f4,roughness:0.6}));
  circ.rotation.x=Math.PI/2; circ.position.set(cx,ly+0.008,cz); gS9.add(circ);
  [-1,1].forEach(s=>{
    line(12,0.08,cx,cz+s*(pl/2-5)); line(0.08,5,cx-6,cz+s*(pl/2-2.5)); line(0.08,5,cx+6,cz+s*(pl/2-2.5));
    line(6,0.08,cx,cz+s*(pl/2-2)); line(0.08,2,cx-3,cz+s*(pl/2-1)); line(0.08,2,cx+3,cz+s*(pl/2-1));
    const gz=cz+s*pl/2;
    makeRods([[V(cx-1.5,ly,gz-s*0.6),V(cx-1.5,ly+2,gz-s*0.6)],
              [V(cx+1.5,ly,gz-s*0.6),V(cx+1.5,ly+2,gz-s*0.6)],
              [V(cx-1.5,ly+2,gz-s*0.6),V(cx+1.5,ly+2,gz-s*0.6)]],0.045,0xffffff,gS9,{seg:6,metal:0.2,rough:0.4});
  });
  label('Этап 9 · Вспомогательный блок 3 этажа + разметка поля', V(W/2,13.0,2.5),'stage',gS9);
}

/* Этап 10 — входная группа */
{
  const CX0=0,CX1=12,CZ0=-3.0,CZ1=0.0,CTOP=FFL+3.2,CDEP=0.55;
  const rodsT=[],rodsB=[],rodsD=[],rodsC=[];
  const xs=[]; for(let x=CX0;x<=CX1;x+=1.5) xs.push(x);
  const zs=[CZ0,-1.5,CZ1];
  const xb=xs.slice(0,-1).map(x=>x+0.75);
  const zb=[-2.25,-0.75];
  xs.forEach((x,i)=>{zs.forEach((z,j)=>{
    if(i<xs.length-1) rodsT.push([V(x,CTOP,z),V(xs[i+1],CTOP,z)]);
    if(j<zs.length-1) rodsT.push([V(x,CTOP,z),V(x,CTOP,zs[j+1])]);});});
  xb.forEach((x,i)=>{zb.forEach((z,j)=>{
    if(i<xb.length-1) rodsB.push([V(x,CTOP-CDEP,z),V(xb[i+1],CTOP-CDEP,z)]);
    if(j<zb.length-1) rodsB.push([V(x,CTOP-CDEP,z),V(x,CTOP-CDEP,zb[j+1])]);
    rodsD.push([V(x,CTOP-CDEP,z),V(xs[i],CTOP,zs[j])],[V(x,CTOP-CDEP,z),V(xs[i+1],CTOP,zs[j])],
               [V(x,CTOP-CDEP,z),V(xs[i],CTOP,zs[j+1])],[V(x,CTOP-CDEP,z),V(xs[i+1],CTOP,zs[j+1])]);});});
  makeRods(rodsT,0.045,0x2e6f9e,gS10); makeRods(rodsB,0.045,0x35807a,gS10); makeRods(rodsD,0.035,0x6fa8c9,gS10);
  [[1.2,CZ0+0.5],[10.8,CZ0+0.5]].forEach(([px,pz])=>{
    const verts=[0,1,2].map(k=>{const a=Math.PI/2+k*2*Math.PI/3; return [px+TRI_R*Math.cos(a),pz+TRI_R*Math.sin(a)];});
    const rr=[]; verts.forEach(([vx,vz])=>rr.push([V(vx,0.05,vz),V(vx,CTOP-CDEP,vz)]));
    makeRods(rr,0.06,0x3a5f8a,gS10,{seg:8});
  });
  [0,6,12].forEach(x=>rodsC.push([V(x,FFL+2.0,0),V(x,CTOP-CDEP,-2.25)]));
  makeRods(rodsC,0.05,0x3a5f8a,gS10);
  box(12.3,0.5,0.08,6,CTOP+0.22,CZ0-0.02,0xd97a1e,gS10,{metal:0.3,rough:0.4});
  box(12.3,0.5,0.08,6,CTOP+0.22,CZ1+0.02,0xd97a1e,gS10,{metal:0.3,rough:0.4});
  box(11.6,0.06,2.7,6,CTOP-CDEP-0.04,-1.5,0xb98a5e,gS10,{rough:0.6});
  box(11.9,0.08,2.9,6,CTOP+0.54,-1.5,0xd6e7f2,gS10,{rough:0.5});
  box(7.0,0.2,4.6,4.1,FFL-0.10,-2.3,0xcdd2d8,gS10,{rough:0.85});                 // входная площадка
  for(let i=1;i<=15;i++){const top=FFL-i*(FFL/15);box(3.0,0.34,0.32,3.8,top-0.09,-4.75-(i-1)*0.30,0xc3c9cf,gS10,{rough:0.9})} // лестница
  makeRods([[V(2.36,FFL+0.9,-4.6),V(2.36,0.9,-9.1)],[V(5.24,FFL+0.9,-4.6),V(5.24,0.9,-9.1)],[V(3.8,FFL+0.9,-4.6),V(3.8,0.9,-9.1)]],0.05,0xd4dae0,gS10,{seg:8,metal:0.85,rough:0.25}); // поручни
  [[1.35],[6.85]].forEach(([sx])=>{ box(0.72,0.75,0.72,sx,FFL+0.375,-3.8,0xb5aa98,gS10,{rough:0.7});
    makeRods([[V(sx,FFL+0.75,-3.8),V(sx,FFL+2.27,-3.8)]],0.16,0x7a5a34,gS10,{seg:10,metal:0.8,rough:0.32});
    makeNodes([V(sx,FFL+2.47,-3.8)],0.135,0x7a5a34,gS10); });                    // скульптуры
  label('Этап 10 · Входная группа: навес, площадка с лестницей и поручнями, скульптуры спортсменов', V(6,CTOP+1.3,-1.5),'stage',gS10);
}

/* Этап 11 — флагштоки и подъём флагов */
const flagGroups=[];
{
  [[0,0],[12,0]].forEach(([fx,fz],idx)=>{
    const base=yB(fx);
    makeRods([[V(fx,base,fz),V(fx,base+6.2,fz)]],0.055,0xcfd6dc,gS11,{seg:8,metal:0.8,rough:0.3});
    makeNodes([V(fx,base+6.35,fz)],0.13,0xd9b23a,gS11);
    const flag=new THREE.Group();
    const cols=idx===0?[0xffffff,0x2b5f9e,0xc93a3a]:[0x2e7d3e,0xffffff,0x2e7d3e];
    cols.forEach((c,i)=>{
      const gg=new THREE.PlaneGeometry(1.8,0.4,16,1);
      const mm=new THREE.Mesh(gg,new THREE.MeshStandardMaterial({color:c,side:THREE.DoubleSide,roughness:0.7}));
      mm.rotation.y=Math.PI/2;
      mm.position.set(0,6.0-i*0.42,-1.02);
      mm.castShadow=true;
      flag.add(mm);
    });
    flag.position.set(fx,FFL+0.4,fz);     // старт у земли
    gS11.add(flag);
    flagGroups.push({flag,base});
  });
  label('Этап 11 · Подъём спортивных флагов на флагштоках главного фасада', V(6,yB(12)+7.6,-1),'stage',gS11);
}

/* ================= ТАЙМЛАЙН ================= */
document.getElementById('pToggle').onclick=()=>{document.getElementById('panel').classList.toggle('collapsed')};
// мастер-выключатель меток (на смартфоне скрыты по умолчанию)
const labelsBox=document.getElementById('labels');
const lbAll=document.getElementById('Lb-all');
if(matchMedia('(max-width: 640px)').matches) lbAll.checked=false;
const applyLblVis=()=>labelsBox.classList.toggle('noLbl',!lbAll.checked);
lbAll.addEventListener('change',applyLblVis); applyLblVis();
const stages=[
  {g:gS1, name:'1. Инженерная подготовка площадки'},
  {g:gS2, name:'2. Укладка ж/б плит-лент 120 мм'},
  {g:gS3, name:'3. Нижний пояс пространственного фундамента'},
  {g:gS4, name:'4. Раскосы + верхний пояс фундамента (подполье 2,12 м)'},
  {g:gS5, name:'5. Пол: сэндвич-панели, отм. +2,400'},
  {g:gS5b,name:'5б. Щиты подполья (ветро-снегозащита)', short:true},
  {g:gS6, name:'6. Колонны △700 / △1200'},
  {g:gS7, name:'7. Покрытие: сборка на земле → подъём', lift:true},
  {g:gS8, name:'8. Ограждение: сэндвич-панели'},
  {g:gS9, name:'9. Вспом. блок + поле'},
  {g:gS10,name:'10. Входная группа: навес, площадка, лестница'},
  {g:gS11,name:'11. Подъём флагов', flags:true},
];
const stageList=document.getElementById('stages');
stages.forEach((s,i)=>{ const li=document.createElement('li'); li.textContent=s.name; stageList.appendChild(li); });
const items=[...stageList.children];
const ease=t=>t*t*(3-2*t);
const N=stages.length;   // t ∈ [0, N]
let t=0.55, playing=false, last=performance.now();
const timeline=document.getElementById('timeline');
const stageName=document.getElementById('stageName');
const playBtn=document.getElementById('playBtn');


function syncLabels(g){
  g.traverse(o=>{ if(o.isCSS2DObject) o.element.style.visibility = g.visible ? 'visible' : 'hidden'; });
}
function apply(t){
  stages.forEach((s,i)=>{
    const local=THREE.MathUtils.clamp(t-i,0,1);
    const e=ease(local);
    if(s.lift){
      s.g.visible=local>0;
      s.g.position.y=-10.0*(1-e);        // сборка на земле → подъём на 10 м
    } else if(s.flags){
      s.g.visible=local>0;
      flagGroups.forEach(({flag,base})=>{ flag.position.y=FFL+0.4+(base-(FFL+0.4))*e; });
    } else {
      s.g.visible=local>0.05;
    }
    syncLabels(s.g);
  });
  const idx=Math.min(N-1,Math.floor(t));
  items.forEach((li,i)=>{ li.classList.toggle('active',i===idx&&t<N);
                          li.classList.toggle('done',i<idx||t>=N); });
  stageName.textContent = t>=N ? 'Сборка завершена · объект сдан' : stages[idx].name;
}
playBtn.onclick=()=>{ playing=!playing; playBtn.textContent=playing?'❚❚':'▶'; if(playing&&t>=N) t=0; };
timeline.oninput=()=>{ t=timeline.value/100; apply(t); };

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});

/* волнообразование флагов */
function waveFlags(time){
  flagGroups.forEach(({flag})=>{
    flag.children.forEach((stripe,si)=>{
      const pos=stripe.geometry.attributes.position;
      for(let k=0;k<pos.count;k++){
        const x=pos.getX(k);
        pos.setZ(k, Math.sin(x*3.0+time*3.2+si*0.5)*0.10*(x+0.9)/1.8);
      }
      pos.needsUpdate=true; stripe.geometry.computeVertexNormals();
    });
  });
}
(function animate(now){
  requestAnimationFrame(animate);
  const dt=(now-last)/1000; last=now;
  if(playing){ t=Math.min(N,t+dt*0.45); timeline.value=Math.round(t*100); apply(t); if(t>=N) playing=false, playBtn.textContent='▶'; }
  if(gS11.visible) waveFlags(now/1000);
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
})(performance.now());
apply(t);
window.__dbg={scene, stages, gS8};
</script>
</body>
